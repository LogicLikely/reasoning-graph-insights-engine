name: Backend CI

on:
    pull_request:
        branches: [main]
        paths:
            - "backend/**"
            - "backend.Tests/**"
            - "*.sln"
            - ".github/workflows/backend-ci.yml"
    workflow_dispatch:

jobs:
    backend:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: reasoning_graph_insights_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d reasoning_graph_insights_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            LOGICLIKELY_TEST_POSTGRES_CONNECTION_STRING: >-
                Host=localhost;Port=5432;Database=reasoning_graph_insights_test;Username=postgres;Password=postgres
            LOGICLIKELY_ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "1"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore --configuration Release

            - name: Test
              run: dotnet test --no-build --configuration Release
